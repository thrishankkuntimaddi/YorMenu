<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>YorMenu · No internet</title>
<style>
  :root { --brand: #b91c1c; --bg: #f7f4ef; --ink: #1f1a17; --ink2: #5c534c; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: var(--ink2); max-width: 420px; margin: 0 auto 16px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font: 600 16px system-ui; cursor: pointer; }
</style>
</head>
<body>
<div>
  <div style="font-size:48px">📡</div>
  <h1>No internet connection</h1>
  <p>YorMenu needs the internet to stay in sync with phones and the kitchen. Check the Wi-Fi or cable. Retrying automatically…</p>
  <button id="retry">Try again</button>
</div>
<script>
  const target = new URLSearchParams(location.search).get('url') || '';
  const go = () => { if (/^https?:\/\//.test(target)) location.href = target; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
