<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>YorMenu · No internet</title>
<style>
  :root { --brand: #b91c1c; --bg: #f6f0e4; --ink: #221a14; --ink2: #5c4e42; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
  h1 { font: 600 28px/1.2 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 18px 0 8px; }
  p { color: var(--ink2); max-width: 420px; margin: 0 auto 16px; }
  button { background: var(--brand); color: #fff; border: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); border-radius: 10px; padding: 12px 22px; font: 600 16px system-ui; cursor: pointer; }
</style>
</head>
<body>
<div>
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#b91c1c"/><path d="M18 40h28a14 14 0 0 0-28 0zm-4 4h36v4H14z" fill="#fff"/><circle cx="32" cy="22" r="3" fill="#fff"/></svg>
  <h1>No internet connection</h1>
  <p>YorMenu needs the internet to stay in sync with phones and the kitchen. Check the Wi-Fi or cable. Retrying automatically…</p>
  <button id="retry">Try again</button>
</div>
<script>
  const target = new URLSearchParams(location.search).get('url') || '';
  const go = () => { if (/^https?:\/\//.test(target)) location.href = target; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
