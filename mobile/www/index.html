<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>YorMenu · No internet</title>
<style>
  :root { --brand: #b91c1c; --bg: #f7f4ef; --ink: #1f1a17; --ink2: #5c534c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151312; --ink: #f3eee9; --ink2: #c4bab1; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, Roboto, "Noto Sans", "Noto Sans Telugu", sans-serif; padding: 16px; text-align: center; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: var(--ink2); max-width: 360px; margin: 0 auto 18px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; min-height: 52px; padding: 0 28px; font: 700 17px system-ui; }
</style>
</head>
<body>
<div>
  <div style="font-size:52px">📡</div>
  <h1>No internet</h1>
  <p>Connect to Wi-Fi or mobile data. YorMenu opens again by itself.<br>ఇంటర్నెట్ లేదు · इंटरनेट नहीं है</p>
  <button id="retry">Try again</button>
</div>
<script>
  const APP = 'https://yormenu.poelys.com/login';
  const go = () => { location.href = APP; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
