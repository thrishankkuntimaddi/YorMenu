<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>YorMenu · No internet</title>
<style>
  :root { --brand: #b91c1c; --bg: #f6f0e4; --ink: #221a14; --ink2: #5c4e42; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, Roboto, "Noto Sans", "Noto Sans Telugu", sans-serif; padding: 16px; text-align: center; }
  h1 { font: 600 28px/1.2 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 18px 0 8px; }
  p { color: var(--ink2); max-width: 360px; margin: 0 auto 18px; }
  button { background: var(--brand); color: #fff; border: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); border-radius: 12px; min-height: 52px; padding: 0 28px; font: 700 17px system-ui; }
</style>
</head>
<body>
<div>
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#b91c1c"/><path d="M18 40h28a14 14 0 0 0-28 0zm-4 4h36v4H14z" fill="#fff"/><circle cx="32" cy="22" r="3" fill="#fff"/></svg>
  <h1>No internet</h1>
  <p>Connect to Wi-Fi or mobile data. YorMenu opens again by itself.<br>ఇంటర్నెట్ లేదు · इंटरनेट नहीं है</p>
  <button id="retry">Try again</button>
</div>
<script>
  const APP = 'https://yormenu.poelys.com/login';
  const go = () => { location.href = APP; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
